name: Feature request
description: Suggest an idea or an improvement for a Dotclear module
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        You can write in English or French.
  - type: textarea
    id: need
    attributes:
      label: What do you need?
      description: Describe the use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested solution
  - type: input
    id: dotclear_version
    attributes:
      label: Dotclear version
      placeholder: ex. 2.39.3
