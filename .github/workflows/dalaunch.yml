name: Launch

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: The Dotclear repository API URL
        required: true
        type: string
        default: 'https://repo.dotclear.watch/'
      new_modules:
        description: New modules to add, as module_id:category_id separated by commas (empty for none)
        required: false
        type: string
        default: ''
      dry_run:
        description: Only list the new modules that would be submitted, without submitting them
        required: false
        type: boolean
        default: false

jobs:
  launch:
    name: Launch Dotclear repository workflow
    runs-on: ubuntu-latest
    steps:
      - name: Parse distant version
        id: distant
        run: |
          echo "Launch plugins update"
          curl \
            -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.USER_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/daread.yml/dispatches \
            -d '{"ref":"master","inputs":{"api_url":"${{ inputs.api_url }}","module_type":"plugin","new_modules":"${{ inputs.new_modules }}","dry_run":"${{ inputs.dry_run }}"}}'
          echo "Launch themes update"
          curl \
            -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.USER_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/daread.yml/dispatches \
            -d '{"ref":"master","inputs":{"api_url":"${{ inputs.api_url }}","module_type":"theme","new_modules":"${{ inputs.new_modules }}","dry_run":"${{ inputs.dry_run }}"}}'

      - name: Send Telegram Message Ok
        uses: appleboy/telegram-action@v1.1.2
        with:
          to: ${{ secrets.TELEGRAM_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            __Dotclear repository contribution update__
            - ${{ inputs.api_url }}
            - Launch update workflows
