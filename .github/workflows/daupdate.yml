name: Update
on: 
  workflow_dispatch:
    inputs:
      api_url:
        description: The repository URL
        required: true
        type: string
        default: 'https://repo.dotclear.watch/'
      module_type:
        description: The module type
        required: true
        type: choice
        default: 'plugin'
        options:
        - plugin
        - theme
      module_id:
        description: The module ID
        required: true
        type: string
      module_version:
        description: The module current version (0 for a new module)
        required: true
        type: string
      module_category:
        description: The category ID, required for a new module
        required: false
        type: string
        default: ''

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      local: ${{ steps.local.outputs.version }}
      newer: ${{ steps.compare.outputs.newer }}
    steps:
      - name: Get repository latest release
        id: release
        uses: pozetroninc/github-action-get-latest-release@master
        with:
          repository: "${{ github.repository_owner }}/${{ inputs.module_id }}"
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Not found
        if: ${{ failure() }}
        id: notfound
        run: |
          echo '* ${{ inputs.module_id }} not found' >> $GITHUB_STEP_SUMMARY
          exit 1
      - name: Parse local version
        if: ${{ success() }}
        id: local
        run: |
          version="${{ steps.release.outputs.release }}"
          echo "version=${version:1}" >> $GITHUB_OUTPUT

      - name: Compare version
        id: compare
        if: ${{ success() }}
        run: |
          echo '* Repository: ${{ inputs.module_version }}' >> $GITHUB_STEP_SUMMARY
          echo '* GH: ${{ steps.local.outputs.version }}' >> $GITHUB_STEP_SUMMARY
          function version { echo "$@" | awk -F. '{ printf("%d%04d%03d\n", $1,$2,$3); }'; }
          if [ $(version '${{ steps.local.outputs.version }}') -gt $(version '${{ inputs.module_version }}') ]; then
          echo '* Module ${{ inputs.module_id }} ${{ inputs.module_version }} has newer version ${{ steps.local.outputs.version }}' >> $GITHUB_STEP_SUMMARY
          echo "newer=true" >> $GITHUB_OUTPUT
          else
          echo '* Module ${{ inputs.module_id }} ${{ inputs.module_version }} is up to date' >> $GITHUB_STEP_SUMMARY
          echo "newer=false" >> $GITHUB_OUTPUT
          fi

  update:
    needs: version
    name: Update version
    runs-on: ubuntu-latest
    if: (needs.version.outputs.newer == 'true')
    steps:
      - name: Update Dotclear repository
        id: dialog
        shell: php {0}
        run: |
          <?php
          $api_url = '${{ inputs.api_url }}api/';
          // parse variables
          $type = '${{ inputs.module_type }}';
          $owner = '${{ github.repository_owner }}';
          $module = '${{ inputs.module_id }}';
          $version = '${{ needs.version.outputs.local }}';
          $zip_url = 'https://github.com/'.$owner.'/'.$module.'/releases/download/v'.$version.'/'.$type.'-'.$module.'.zip';
          file_put_contents(getenv('GITHUB_OUTPUT'), "version=$version\n", FILE_APPEND);
          file_put_contents(getenv('GITHUB_OUTPUT'), "module=$module\n", FILE_APPEND);

          // authenticate to Dotclear repository
          echo "Authenticate to Dotclear repository API.\n";
          $ch = curl_init();
          curl_setopt_array($ch, [
            CURLOPT_URL => $api_url  . 'auth',
            CURLOPT_RETURNTRANSFER => true,
            CURLOPT_POST => true,
            CURLOPT_POSTFIELDS => http_build_query([
              'username' => '${{ secrets.DA_USERNAME }}',
              'password' => '${{ secrets.DA_PASSWORD }}',
            ]),
          ]);
          $rsp = json_decode((string) curl_exec($ch), true);
          curl_close ($ch);
          if (!is_array($rsp) || !isset($rsp['content']['token'])) {
            file_put_contents(getenv('GITHUB_OUTPUT'), "message=Failed to get token\n", FILE_APPEND);
            echo 'Failed to get token';
            return;
          }
          $token = $rsp['content']['token'];

          // Get zip content
          echo 'Grab module zip at ' . $zip_url . "\n";
          $ch = curl_init();
          curl_setopt_array($ch, [
            CURLOPT_URL => $zip_url,
            CURLOPT_RETURNTRANSFER => true,
            CURLOPT_FOLLOWLOCATION => true, 
          ]);
          $zip_raw = (string) curl_exec($ch);
          $zip_cnt = chunk_split(base64_encode($zip_raw));
          curl_close ($ch);
          if (strlen($zip_cnt) < 16) {
            file_put_contents(getenv('GITHUB_OUTPUT'), "message=Failed to get zip content\n", FILE_APPEND);
            echo 'Failed to get zip content';
            return;
          }

          // Call a repository API endpoint that only needs the type
          $repo_list = function (string $endpoint) use ($api_url, $token): array {
            $ch = curl_init();
            curl_setopt_array($ch, [
              CURLOPT_URL => $api_url . $endpoint,
              CURLOPT_HTTPHEADER => ['Authorization: Bearer ' . $token],
              CURLOPT_RETURNTRANSFER => true,
              CURLOPT_POST => true,
              CURLOPT_POSTFIELDS => ['type' => '${{ inputs.module_type }}'],
            ]);
            $rsp = json_decode((string) curl_exec($ch), true);
            curl_close($ch);

            return is_array($rsp) && is_array($rsp['content'] ?? null) ? $rsp['content'] : [];
          };
          $fold = fn (string $s): string => strtr(mb_strtolower($s), ['à' => 'a', 'â' => 'a', 'ä' => 'a', 'ç' => 'c', 'é' => 'e', 'è' => 'e', 'ê' => 'e', 'ë' => 'e', 'î' => 'i', 'ï' => 'i', 'ô' => 'o', 'ö' => 'o', 'ù' => 'u', 'û' => 'u', 'ü' => 'u', 'ÿ' => 'y', 'œ' => 'oe', 'æ' => 'ae']);

          // License: recognized from the LICENSE file of the zip, only if the repository supports it
          $license = '';
          $tmp = tempnam(sys_get_temp_dir(), 'zip');
          file_put_contents($tmp, $zip_raw);
          $zip = new ZipArchive();
          if ($zip->open($tmp) === true) {
            foreach (['LICENSE', 'LICENSE.md', 'LICENSE.txt', 'COPYING'] as $file) {
              $text = $zip->getFromName($module . '/' . $file);
              if (is_string($text) && $text !== '') {
                $text = strtoupper(substr($text, 0, 2000));
                $license = match (true) {
                  str_contains($text, 'GNU AFFERO GENERAL PUBLIC LICENSE') => str_contains($text, 'VERSION 3') ? 'agpl3' : 'agpl2',
                  str_contains($text, 'GNU LESSER GENERAL PUBLIC LICENSE') => 'lgpl2',
                  str_contains($text, 'GNU GENERAL PUBLIC LICENSE') => str_contains($text, 'VERSION 3') ? 'gpl3' : 'gpl2',
                  str_contains($text, 'MIT LICENSE') => 'mit',
                  str_contains($text, 'APACHE LICENSE') => 'apache',
                  default => '',
                };
                break;
              }
            }
            $zip->close();
          }
          unlink($tmp);
          if ($license !== '' && !array_key_exists($license, $repo_list('licenses'))) {
            $license = '';
          }
          echo 'License: ' . ($license ?: 'not found') . "\n";

          // Tags: GitHub topics of the module, without the generic ones, that exist on the repository
          // (topics have no accent: "developpement" gives the tag "développement")
          $tags = [];
          $ch = curl_init();
          curl_setopt_array($ch, [
            CURLOPT_URL => 'https://api.github.com/repos/' . $owner . '/' . $module . '/topics',
            CURLOPT_HTTPHEADER => [
              'Accept: application/vnd.github+json',
              'Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}',
              'User-Agent: ' . $owner,
            ],
            CURLOPT_RETURNTRANSFER => true,
          ]);
          $topics = json_decode((string) curl_exec($ch), true);
          curl_close($ch);
          $topics = array_diff(is_array($topics['names'] ?? null) ? $topics['names'] : [], ['dotclear', 'plugin', 'theme', 'dotclear-plugin', 'dotclear-theme']);
          if ($topics !== []) {
            foreach ($repo_list('tags') as $tag) {
              if (in_array(str_replace(' ', '-', $fold((string) $tag)), $topics, true)) {
                $tags[] = (string) $tag;
              }
            }
          }
          echo 'Tags: ' . ($tags === [] ? 'none' : implode(', ', $tags)) . "\n";

          // Update Dotclear repository
          echo "Update contribution.\n";
          $ch = curl_init();
          curl_setopt_array($ch, [
            CURLOPT_URL => $api_url . 'update',
            CURLOPT_HTTPHEADER => ['Authorization: Bearer ' . $token],
            CURLOPT_HEADER => false,
            CURLOPT_RETURNTRANSFER => true,
            CURLOPT_POST => true,
            CURLOPT_POSTFIELDS => array_filter([
              'type' => '${{ inputs.module_type }}',
              'zip' => $zip_cnt,
              'readme_update' => '1',
              'category' => '${{ inputs.module_category }}',
              'license' => $license,
              'tags' => implode(',', $tags),
            ], fn ($v) => $v !== ''),
          ]);
          $rsp = json_decode((string) curl_exec($ch), true);
          curl_close($ch);
          if (is_array($rsp) && isset($rsp['message'])) {
            $rsp['message'] = trim(preg_replace('/\s+/', ' ', (string) $rsp['message']));
            file_put_contents(getenv('GITHUB_OUTPUT'), "message=" . $rsp['message'] . "\n", FILE_APPEND);
            echo $rsp['message'];
          }

      - name: summary
        env:
          MODULE: ${{ steps.dialog.outputs.module }}
          VERSION: ${{ steps.dialog.outputs.version }}
          MESSAGE: ${{ steps.dialog.outputs.message }}
        run: echo "$MODULE $VERSION = $MESSAGE" >> $GITHUB_STEP_SUMMARY

      - name: Send Telegram Message Ok
        uses: appleboy/telegram-action@v1.1.2
        with:
          to: ${{ secrets.TELEGRAM_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            __Dotclear repository contribution update__
            - ${{ inputs.api_url }}
            - Module: ${{ steps.dialog.outputs.module }} ${{ steps.dialog.outputs.version }}${{ inputs.module_version == '0' && ' (new)' || '' }}
            - Response: ${{ steps.dialog.outputs.message }}
